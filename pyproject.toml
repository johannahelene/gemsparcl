[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsparcl"
version = "1.0.0"
description = "Ultra-fast genome clustering using advanced sketching"
authors = [
    {name = "Johanna von Wachsmann", email = "wachsmannj@ebi.ac.uk"},
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"

dependencies = [
    "click>=7.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "networkx>=2.6",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
    "psutil>=5.8.0",
]

[project.scripts]
gemsparcl = "gemsparcl.cli:main"

[project.urls]
Homepage = "https://github.com/johannahelene/gemsparcl"
Repository = "https://github.com/johannahelene/gemsparcl"
Issues = "https://github.com/johannahelene/gemsparcl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemsparcl*"]
