[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsparcl"
version = "1.0.0"
description = "Ultra-fast genome dereplication using advanced sketching (~100x faster than existing tools)"
authors = [
    {name = "Johanna von Wachsmann", email = "wachsmannj@ebi.ac.uk"},
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["bioinformatics", "genomics", "clustering", "bindash", "dereplication", "sketching", "ANI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "click>=7.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "networkx>=2.6", 
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
]

[project.scripts]
gemsparcl = "gemsparcl.cli:main"

[project.urls]
Homepage = "https://github.com/johannahelene/gemsparcl"
Repository = "https://github.com/johannahelene/gemsparcl"
Issues = "https://github.com/johannahelene/gemsparcl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemsparcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"] 
python_functions = ["test_*"]
addopts = "--cov=gemsparcl --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]