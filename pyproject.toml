[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsparcl"
version = "1.0.0"
description = "Ultra-fast genome clustering using advanced sketching"
authors = [
    {name = "Johanna von Wachsmann", email = "wachsmannj@ebi.ac.uk"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
]

[project.scripts]
gemsparcl = "gemsparcl.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/johannahelene/gemsparcl"
Repository = "https://github.com/johannahelene/gemsparcl"
Issues = "https://github.com/johannahelene/gemsparcl/issues"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gemsparcl*"]
